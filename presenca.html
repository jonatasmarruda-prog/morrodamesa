<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Lista de Presença Ônibus - Trilha Morro da Mesa</title>

<style>
:root{
--bg1:#020617;
--bg2:#0f172a;
--line:rgba(255,255,255,.08);
--txt:#ffffff;
--muted:#cbd5e1;
--green:#16a34a;
--green2:#22c55e;
--red:#dc2626;
--red2:#ef4444;
--shadow:0 10px 28px rgba(0,0,0,.28);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at top left,#1e293b 0%,transparent 35%),
linear-gradient(180deg,var(--bg2),var(--bg1));
color:var(--txt);
min-height:100vh;
}

header{
position:sticky;
top:0;
z-index:50;
padding:14px;
background:rgba(2,6,23,.94);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);
}

.topo{
display:flex;
gap:12px;
align-items:center;
margin-bottom:12px;
}

.logo{
width:48px;
height:48px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
box-shadow:var(--shadow);
}

h1{
font-size:20px;
font-weight:900;
line-height:1.1;
}

.sub{
font-size:13px;
color:var(--muted);
margin-top:3px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid var(--line);
border-radius:14px;
padding:10px 6px;
text-align:center;
}

.card b{
display:block;
font-size:22px;
font-weight:900;
}

.card span{
font-size:12px;
color:var(--muted);
}

main{
max-width:760px;
margin:auto;
padding:14px;
padding-bottom:28px;
}

.search{
width:100%;
height:54px;
border:none;
outline:none;
border-radius:16px;
padding:0 16px;
font-size:17px;
font-weight:700;
margin-bottom:12px;
}

.list{
display:grid;
gap:10px;
}

.item{
min-height:62px;
padding:14px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:18px;
font-weight:900;
cursor:pointer;
user-select:none;
box-shadow:var(--shadow);
}

.item.ok{
background:linear-gradient(180deg,var(--green2),var(--green));
border:2px solid #15803d;
}

.item.no{
background:linear-gradient(180deg,var(--red2),var(--red));
border:2px solid #b91c1c;
}

.reset{
width:100%;
height:54px;
margin-top:16px;
border:none;
border-radius:16px;
font-size:16px;
font-weight:900;
cursor:pointer;
background:#334155;
color:#fff;
}

.msg{
text-align:center;
padding:18px;
color:#cbd5e1;
font-weight:700;
}

footer{
text-align:center;
padding:18px;
font-size:12px;
color:#94a3b8;
}
</style>
</head>

<body>

<header>
<div class="topo">
<div class="logo">🚌</div>

<div>
<h1>Lista de Presença Ônibus</h1>
<div class="sub">Trilha Morro da Mesa</div>
</div>
</div>

<div class="stats">
<div class="card">
<b id="okCount">0</b>
<span>Presentes</span>
</div>

<div class="card">
<b id="noCount">0</b>
<span>Faltando</span>
</div>

<div class="card">
<b id="totalCount">0</b>
<span>Total</span>
</div>
</div>
</header>

<main>

<input type="text" class="search" id="search" placeholder="🔎 Buscar nome...">

<div class="list" id="list">
<div class="msg">Carregando nomes...</div>
</div>

<button class="reset" onclick="resetar()">♻️ Resetar Lista</button>

</main>

<footer>
Sincronizado em tempo real 🔥
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyAUssjdtiOs0oO9yhWV3dExsj7sGaB4jEA",
authDomain: "onibus-morro-da-mesa.firebaseapp.com",
databaseURL: "https://onibus-morro-da-mesa-default-rtdb.firebaseio.com",
projectId: "onibus-morro-da-mesa",
storageBucket: "onibus-morro-da-mesa.firebasestorage.app",
messagingSenderId: "21597144482",
appId: "1:21597144482:web:93a55c39d477e67c1d5efb"
};

firebase.initializeApp(firebaseConfig);

const ref = firebase.database().ref("/");

const list = document.getElementById("list");
const search = document.getElementById("search");
const okCount = document.getElementById("okCount");
const noCount = document.getElementById("noCount");
const totalCount = document.getElementById("totalCount");

let dados = {};

function vibrar(){
if(navigator.vibrate) navigator.vibrate(25);
}

function render(){

const filtro = search.value.toLowerCase().trim();

list.innerHTML = "";

const nomes = Object.keys(dados);

const ordenados = nomes.sort((a,b)=>{
if(dados[a] === dados[b]) return a.localeCompare(b);
return dados[b] - dados[a];
});

const filtrados = ordenados.filter(nome =>
nome.toLowerCase().includes(filtro)
);

let presentes = 0;

nomes.forEach(nome=>{
if(dados[nome] === true) presentes++;
});

if(filtrados.length === 0){
list.innerHTML = '<div class="msg">Nenhum nome encontrado</div>';
}

filtrados.forEach(nome=>{

const confirmado = dados[nome] === true;

const div = document.createElement("div");

div.className = "item " + (confirmado ? "ok":"no");

div.innerHTML = confirmado ? "✅ " + nome : "❌ " + nome;

div.onclick = ()=>{
ref.child(nome).set(!confirmado);
vibrar();
};

list.appendChild(div);

});

okCount.textContent = presentes;
noCount.textContent = nomes.length - presentes;
totalCount.textContent = nomes.length;

}

ref.on("value",(snap)=>{
dados = snap.val() || {};
render();
});

function resetar(){
if(confirm("Deseja resetar toda lista?")){
const novo = {};
Object.keys(dados).forEach(nome=>{
novo[nome] = false;
});
ref.set(novo);
}
}

search.addEventListener("input",render);
</script>

</body>
</html>
