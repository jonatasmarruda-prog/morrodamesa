<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Presença Ônibus</title>

<style>
:root{
--verde:#16a34a;
--vermelho:#dc2626;
--fundo1:#0f172a;
--fundo2:#111827;
--texto:#ffffff;
--muted:#cbd5e1;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(180deg,var(--fundo1),var(--fundo2));
color:var(--texto);
min-height:100vh;
}

header{
padding:18px;
text-align:center;
background:#0b1220;
position:sticky;
top:0;
z-index:10;
border-bottom:1px solid rgba(255,255,255,.08);
}

h1{
font-size:28px;
margin-bottom:8px;
}

p{
font-size:14px;
color:var(--muted);
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.card{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:12px;
font-size:14px;
}

.card b{
display:block;
font-size:22px;
margin-bottom:4px;
color:#fff;
}

main{
max-width:760px;
margin:auto;
padding:15px;
}

.search{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
font-size:16px;
margin-bottom:15px;
}

.list{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.item{
padding:18px;
border-radius:12px;
font-weight:700;
font-size:16px;
cursor:pointer;
user-select:none;
transition:none;
box-shadow:none;
transform:none;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
min-height:58px;
letter-spacing:.3px;
}

.item.ok{
background:var(--verde);
border:2px solid var(--verde);
color:#fff;
}

.item.no{
background:var(--vermelho);
border:2px solid var(--vermelho);
color:#fff;
}

.item:hover{
opacity:.95;
}

.reset{
width:100%;
margin-top:18px;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#334155;
color:#fff;
}

footer{
text-align:center;
padding:20px;
font-size:13px;
color:#94a3b8;
}
</style>
</head>

<body>

<header>
<h1>🚌 Lista de Presença</h1>
<p>Toque no nome para confirmar</p>

<div class="stats">
<div class="card"><b id="okCount">0</b>Presentes</div>
<div class="card"><b id="noCount">0</b>Faltando</div>
<div class="card"><b id="totalCount">0</b>Total</div>
</div>
</header>

<main>

<input type="text" class="search" id="search" placeholder="Buscar nome...">

<div class="list" id="list"></div>

<button class="reset" onclick="resetar()">Resetar Lista</button>

</main>

<footer>
Sistema de embarque 🚍
</footer>

<script>
const nomes = [
"Jonatas","Sejane","Aurelio","Halejandro","Vitoria","Gabriel","Flavia","Angela","Layza","Mirian","Rosângela","Jociela","Jefferson","Debora","Matheus","Pedro","Joao","Marta","Tarcisio","Selma","Luis Sassamot","Gregoria","Wilgleison","Edivaldo","Aline","Andyell","Edilma","Talita","Vanessa","Patricia","Renata","Prisicila","Soraya","Ludimila","Jessyca","Bruna","Joao vitor F","Franciele","Patricia Luciana","Antonio Elias","Luciene","Marcella","Lais","Josi","Fran","Gean","Isabele","Camily","Fernanda Mendes","Diana","Lilian","Elionete","Edinalva","Rivair","Gustavo","Karol Guimaraes","Thais","Estela","Glauciele","Elvis","Paulo","Thaiani","Thaiza","Eliene","Nadila","Tathayane","Willian Matheus","Itahaem","Rosaura","Rafael","Edilaine","Graciella","Debora","Darlene","Marilene","Higor","Jean","Luana","Luis H","Amanda","Marcia","Yasmim","Izabel","Dayse","Natana","Letícia","Eulalia","Neyla"
];

let status = {};
nomes.forEach(nome => status[nome] = false);

const list = document.getElementById("list");
const okCount = document.getElementById("okCount");
const noCount = document.getElementById("noCount");
const totalCount = document.getElementById("totalCount");
const search = document.getElementById("search");

function render(){
list.innerHTML = "";

let filtro = search.value.toLowerCase();
let presentes = 0;

nomes.forEach(nome => {

if(status[nome]) presentes++;

if(nome.toLowerCase().includes(filtro)){

const item = document.createElement("div");

item.className = "item " + (status[nome] ? "ok" : "no");
item.innerHTML = (status[nome] ? "✅ " : "❌ ") + nome;

item.onclick = () => {
status[nome] = !status[nome];
render();
};

list.appendChild(item);
}
});

okCount.innerText = presentes;
noCount.innerText = nomes.length - presentes;
totalCount.innerText = nomes.length;
}

function resetar(){
if(confirm("Deseja resetar toda lista?")){
nomes.forEach(nome => status[nome] = false);
render();
}
}

search.addEventListener("keyup", render);

render();
</script>

</body>
</html>
