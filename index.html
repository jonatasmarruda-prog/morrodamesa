<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Presença Ônibus</title>

<style>
:root{
--ok:#22c55e;
--no:#ef4444;
--bg1:#0f172a;
--bg2:#111827;
--text:#ffffff;
--muted:#cbd5e1;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(180deg,var(--bg1),var(--bg2));
color:var(--text);
min-height:100vh;
}

header{
padding:20px;
text-align:center;
background:rgba(0,0,0,.25);
backdrop-filter:blur(8px);
position:sticky;
top:0;
z-index:10;
}

h1{
font-size:28px;
margin-bottom:10px;
}

p{
color:var(--muted);
font-size:14px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.card{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:14px;
font-size:14px;
}

.card b{
display:block;
font-size:22px;
margin-bottom:5px;
}

main{
padding:15px;
max-width:700px;
margin:auto;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin-bottom:15px;
font-size:16px;
}

.list{
display:grid;
gap:10px;
}

.item{
padding:16px;
border-radius:14px;
font-weight:bold;
cursor:pointer;
transition:.2s;
user-select:none;
}

.item.ok{
background:rgba(34,197,94,.18);
border:2px solid var(--ok);
}

.item.no{
background:rgba(239,68,68,.18);
border:2px solid var(--no);
}

.item:hover{
transform:scale(1.01);
}

.reset{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#334155;
color:white;
}

footer{
text-align:center;
padding:20px;
font-size:13px;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="stats">

<main>

<div class="list" id="list"></div>

<button class="reset" onclick="resetar()">Resetar Lista</button>

</main>

const search = document.getElementById("search");

const div = document.createElement("div");

div.onclick = ()=>{
status[nome]=!status[nome];
render();
};

list.appendChild(div);
}

if(status[nome]) presentes++;

});

okCount.innerText = presentes;
noCount.innerText = nomes.length - presentes;
totalCount.innerText = nomes.length;
}

function resetar(){
if(confirm("Deseja resetar presença de todos?")){
nomes.forEach(nome=>{
status[nome]=false;
});
render();
}
}

search.addEventListener("keyup",render);
