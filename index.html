<body>

<header>

<p>Trilha Morro da Mesa</p>

<b id="noCount">0</b>
<span>Faltando</span>
</div>

<b id="totalCount">0</b>
<span>Total</span>
</div>
</div>

</header>

<main>

<div class="searchWrap">
<input class="search" id="search" type="text" placeholder="🔎 Buscar nome...">
</div>

<div class="list" id="list"></div>

<button class="reset" onclick="resetar()">♻️ Resetar Lista</button>

</main>

<footer>
Sistema de embarque premium 🚍
</footer>

<script>
const nomes = [
"Jonatas","Sejane","Aurelio","Halejandro","Vitoria","Gabriel","Flavia","Angela","Layza","Mirian","Rosângela","Jociela","Jefferson","Debora","Matheus","Pedro","Joao","Marta","Tarcisio","Selma","Luis Sassamot","Gregoria","Wilgleison","Edivaldo","Aline","Andyell","Edilma","Talita","Vanessa","Patricia","Renata","Prisicila","Soraya","Ludimila","Jessyca","Bruna","Joao vitor F","Franciele","Patricia Luciana","Antonio Elias","Luciene","Marcella","Lais","Josi","Fran","Gean","Isabele","Camily","Fernanda Mendes","Diana","Lilian","Elionete","Edinalva","Rivair","Gustavo","Karol Guimaraes","Thais","Estela","Glauciele","Elvis","Paulo","Thaiani","Thaiza","Eliene","Nadila","Tathayane","Willian Matheus","Itahaem","Rosaura","Rafael","Edilaine","Graciella","Debora","Darlene","Marilene","Higor","Jean","Luana","Luis H","Amanda","Marcia","Yasmim","Izabel","Dayse","Natana","Letícia","Eulalia","Neyla"
];

let status = {};
nomes.forEach(n => status[n]=false);

const list = document.getElementById("list");
const okCount = document.getElementById("okCount");
const noCount = document.getElementById("noCount");
const totalCount = document.getElementById("totalCount");
const search = document.getElementById("search");

function vibrar(){
if(navigator.vibrate) navigator.vibrate(30);
}

function render(){

list.innerHTML = "";

const filtro = search.value.trim().toLowerCase();

let presentes = 0;

nomes.forEach(nome=>{
if(status[nome]) presentes++;
});

const ordenados = [...nomes].sort((a,b)=>{
if(status[a] === status[b]) return a.localeCompare(b);
return status[b] - status[a];
});

const filtrados = ordenados.filter(nome =>
nome.toLowerCase().includes(filtro)
);

if(filtrados.length === 0){
list.innerHTML = '<div class="vazio">Nenhum nome encontrado</div>';
}

filtrados.forEach(nome=>{

const div = document.createElement("div");

div.className = "item " + (status[nome] ? "ok":"no");

div.innerHTML = status[nome]
? "✅ " + nome
: "❌ " + nome;

div.onclick = ()=>{
status[nome] = !status[nome];
vibrar();
render();
};

list.appendChild(div);

});

okCount.textContent = presentes;
noCount.textContent = nomes.length - presentes;
totalCount.textContent = nomes.length;

}

function resetar(){
if(confirm("Deseja resetar toda a lista?")){
nomes.forEach(nome => status[nome] = false);
render();
}
}

search.addEventListener("input",render);

render();
</script>

</body>
